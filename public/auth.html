<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 / 注册 · 代理客户端大全</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/"><span class="brand-mark">代</span><span id="siteName">代理客户端大全</span></a>
  </div>
</header>
<main class="wrap">
  <div class="auth-card">
    <h1 id="authTitle">登录</h1>
    <div class="auth-tabs" role="group" aria-label="登录或注册">
      <button type="button" id="tabLogin" class="active">登录</button>
      <button type="button" id="tabRegister">注册</button>
    </div>
    <form id="authForm" class="stacked">
      <label>用户名
        <input name="username" type="text" autocomplete="username" required>
      </label>
      <label>密码
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="authHint" class="muted">登录已有账号。</p>
      <div><button type="submit" id="authSubmit">登录</button></div>
      <p id="authErr" class="error" hidden></p>
    </form>
    <div id="authedBox" hidden>
      <p>已登录为 <strong id="authedName"></strong></p>
      <p><a href="/">返回首页</a> · <button type="button" class="secondary" id="authLogout">退出登录</button></p>
    </div>
  </div>
</main>
<footer class="wrap site-footer">
  <p>本站仅收录官方下载链接，不含任何邀请码或推广链接。</p>
</footer>
<nav class="bottom-nav" aria-label="主要栏目">
  <a href="/#apps"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg><span>软件</span></a>
  <a href="/#airports"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="22 2 11 13"></polygon><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg><span>机场</span></a>
  <a href="/my.html"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>我的</span></a>
</nav>
<script src="/auth.js"></script>
</body>
</html>
